[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-contract-resolution"
version = "0.1.0"
description = "BC08 immutable payload contract resolution and validation"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/mozaic_contract_resolution"]

[tool.hatch.build.targets.sdist]
include = ["src/mozaic_contract_resolution/**", "pyproject.toml"]
