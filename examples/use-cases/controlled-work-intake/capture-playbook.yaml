dsl_version: capture-playbook-draft/v3
playbook_id: controlled-work-intake-records
status: draft
source:
  source_id: controlled-http
  revision: controlled-work-intake-v1
  origin: https://api.fixture.test
  path_prefixes: [/v1/items]
objective: Capture one parameter-selected record from the isolated M5 test source.
proposal_ref: controlled-work-intake-v1
findings:
  - finding_id: controlled-parameterized-json-shape
    classification: observed
    evidence_refs: [controlled-json-response]
evidence:
  - {evidence_ref: controlled-json-response, sha256: 2c0a70b19a7c260bcbed75f960401fec0f645500ddcf1b33c7b71e2cde5e291b}
capabilities: [http.fetch.fixture, json.path_restricted, records.extract, output.records.jsonl]
budgets: {max_requests: 1, max_pages: 1, max_response_bytes: 2048, max_records: 10, max_output_bytes: 1000000}
failure_policy: {missing_fixture: fail, invalid_record: fail, missing_required_field: fail, conversion_error: fail}
output_contract:
  record_type: object
  fields:
    id: {type: string, required: true}
    quantity: {type: integer, required: true}
    unit_price: {type: decimal, required: true}
    enabled: {type: boolean, required: true}
operations:
  - id: response
    op: http.fetch/v1
    url: https://api.fixture.test/v1/items?limit=1
    input_query: {parameter: limit, query_name: limit}
    content_type: application/json
    evidence_refs: [controlled-json-response]
  - id: items
    op: select.json_records/v1
    document: {operation: response, port: document}
    array_path: /items/*
    max_matches: 10
    evidence_refs: [controlled-json-response]
  - id: extract
    op: extract.fields/v1
    records: {operation: items, port: records}
    fields:
      id: {source: json_value, path: /id, type: string, required: true, normalize: [trim]}
      quantity: {source: json_value, path: /quantity, type: integer, required: true, normalize: [trim]}
      unit_price: {source: json_value, path: /unit_price, type: decimal, required: true, normalize: [trim]}
      enabled: {source: json_value, path: /enabled, type: boolean, required: true, normalize: [trim]}
  - id: emit
    op: output.records/v1
    records: {operation: extract, port: records}
