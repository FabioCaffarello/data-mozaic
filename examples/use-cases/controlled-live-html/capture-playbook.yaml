dsl_version: capture-playbook-draft/v2
playbook_id: controlled-live-html-records
status: draft
source:
  source_id: controlled-http
  revision: controlled-v1
  origin: https://api.fixture.test
  path_prefixes: [/v1/html]
objective: Extract a deterministic HTML record from the isolated controlled test source.
proposal_ref: controlled-live-html-v1
findings:
  - finding_id: controlled-test-html-shape
    classification: observed
    evidence_refs: [controlled-html-response]
evidence:
  - {evidence_ref: controlled-html-response, sha256: 159a9d0aed4acd5deb5b4482aa9bc790a325016e7fc55c2aeb1e040441967f1d}
capabilities: [http.fetch.fixture, html.css_select, records.extract, output.records.jsonl, output.raw.reference]
budgets: {max_requests: 1, max_pages: 1, max_response_bytes: 2048, max_records: 10, max_output_bytes: 1000000}
failure_policy: {missing_fixture: fail, invalid_record: fail, missing_required_field: fail, conversion_error: fail}
output_contract:
  record_type: object
  fields:
    id: {type: string, required: true}
    title: {type: string, required: true}
    price: {type: decimal, required: true}
operations:
  - id: response
    op: http.fetch/v1
    url: https://api.fixture.test/v1/html
    content_type: text/html
    evidence_refs: [controlled-html-response]
  - id: products
    op: select.html_records/v1
    documents: {operation: response, port: document}
    selector: article.product
    cardinality: many
    max_matches: 10
    evidence_refs: [controlled-html-response]
  - id: extract
    op: extract.fields/v1
    records: {operation: products, port: records}
    fields:
      id: {source: attribute, attribute: data-id, type: string, required: true, normalize: [trim]}
      title: {source: text, selector: .title, type: string, required: true, normalize: [trim, collapse_whitespace]}
      price: {source: text, selector: .price, type: decimal, required: true, normalize: [trim]}
  - id: emit
    op: output.records/v1
    records: {operation: extract, port: records}
  - id: raw_refs
    op: output.raw/v1
    documents: {operation: response, port: document}
