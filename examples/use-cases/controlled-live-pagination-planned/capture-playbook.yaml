dsl_version: capture-playbook-draft/v2
playbook_id: controlled-live-pagination-planned-records
status: draft
source:
  source_id: controlled-http
  revision: controlled-v1
  origin: https://api.fixture.test
  path_prefixes: [/v1/window/]
objective: Read exactly two controlled HTML pages as an explicitly bounded window.
proposal_ref: controlled-live-pagination-planned-v1
findings:
  - finding_id: controlled-test-pagination-planned
    classification: observed
    evidence_refs: [controlled-window-page-1, controlled-window-page-2]
evidence:
  - {evidence_ref: controlled-window-page-1, sha256: 34993b7b1ebe80de6af44aa14632792b2456b7dc9bdd82851a3cce3b95f47be5}
  - {evidence_ref: controlled-window-page-2, sha256: db93882bb4f0b6ade8efb496d9bd1110ca527ac20d5de2facdf238125b859273}
capabilities: [http.fetch.fixture, links.discover.fixture, pagination.bounded.fixture, html.css_select, records.extract, output.records.jsonl, output.raw.reference]
budgets: {max_requests: 2, max_pages: 2, max_response_bytes: 512, max_records: 10, max_output_bytes: 1000000}
failure_policy: {missing_fixture: fail, invalid_record: fail, missing_required_field: fail, conversion_error: fail}
output_contract:
  record_type: object
  fields:
    id: {type: string, required: true}
    name: {type: string, required: true}
operations:
  - id: start
    op: http.fetch/v1
    url: https://api.fixture.test/v1/window/1
    content_type: text/html
    evidence_refs: [controlled-window-page-1]
  - id: discovered
    op: links.discover/v1
    document: {operation: start, port: document}
    selector: a.next
    attribute: href
    max_links: 5
    evidence_refs: [controlled-window-page-1]
  - id: pages
    op: pagination.bounded/v1
    links: {operation: discovered, port: links}
    max_pages: 2
    stop_when_no_links: true
    completion_mode: bounded_window
  - id: items
    op: select.html_records/v1
    documents: {operation: pages, port: documents}
    selector: article.item
    cardinality: many
    max_matches: 10
    evidence_refs: [controlled-window-page-1, controlled-window-page-2]
  - id: extract
    op: extract.fields/v1
    records: {operation: items, port: records}
    fields:
      id: {source: attribute, attribute: data-id, type: string, required: true, normalize: [trim]}
      name: {source: text, selector: .name, type: string, required: true, normalize: [trim]}
  - id: emit
    op: output.records/v1
    records: {operation: extract, port: records}
  - id: raw_refs
    op: output.raw/v1
    documents: {operation: pages, port: documents}
