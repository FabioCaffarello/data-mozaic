[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-collector-engineering"
version = "0.3.0"
description = "Draft CapturePlaybook authoring, typed IR, and fixture-only Python Reference and Scrapy compilation for BC15"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "mozaic-bot-build==0.1.0",
    "PyYAML>=6.0,<7",
    "scrapy==2.20.0",
    "selectolax>=0.4.13,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["collector_engineering"]

[tool.hatch.build.targets.sdist]
include = ["collector_engineering/**", "pyproject.toml"]
