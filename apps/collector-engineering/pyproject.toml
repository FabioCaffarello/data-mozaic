[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-collector-engineering"
version = "0.1.0"
description = "Draft CapturePlaybook authoring and replay for BC15"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["collector_engineering"]
