[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-acquisition-lifecycle"
version = "0.1.0"
description = "Operator composition for BC01, BC11, BC15 and BC04 acquisition lifecycle capabilities"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44,<47",
    "jsonschema[format]>=4.23,<5",
    "mozaic-bot-build==0.1.0",
    "mozaic-collector-engineering==0.3.0",
    "mozaic-contract-resolution==0.1.0",
    "mozaic-execution-coordination==0.1.0",
    "psycopg[binary]>=3.2,<4",
    "rfc8785>=0.1.4,<1",
]

[project.scripts]
acquisition-lifecycle = "acquisition_lifecycle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_lifecycle"]

[tool.hatch.build.targets.sdist]
include = ["src/acquisition_lifecycle/**", "pyproject.toml"]
