[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-acquisition-output"
version = "0.1.0"
description = "BC05 acquisition output domain and application ports"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47", "pymongo==4.20.0", "rfc8785>=0.1.4,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_output"]
