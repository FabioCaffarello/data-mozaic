[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-scout"
version = "0.1.0"
description = "Internal BC14 Scout application module"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "jsonschema[format]>=4.23,<5",
    "mcp>=1.30,<2",
    "mozaic-observability",
    "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.uv.sources]
mozaic-observability = { workspace = true }
