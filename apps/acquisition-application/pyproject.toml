[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozaic-trusted-acquisition-application"
version = "0.1.0"
description = "Trusted acquisition result import and BC04–BC06 composition"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "mozaic-acquisition-output==0.1.0",
    "mozaic-bot-build==0.1.0",
    "mozaic-collector-engineering==0.3.0",
    "mozaic-contract-resolution==0.1.0",
    "mozaic-execution-coordination==0.1.0",
    "mozaic-acquisition-lifecycle==0.1.0",
    "mozaic-work-intake==0.1.0",
    "pymongo>=4.10,<5",
]

[project.scripts]
acquisition-operator = "acquisition_application.operational_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition_application"]

[tool.hatch.build.targets.sdist]
include = ["src/acquisition_application/**", "pyproject.toml"]
