[project]
name = "data-mozaic-workspace"
version = "0.0.0"
description = "Development tooling for the Data Mozaic monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "jsonschema[format]>=4.23,<5",
    "pre-commit>=4.5,<5",
    "psycopg[binary]>=3.2,<4",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/scout",
    "apps/collector-engineering",
    "apps/workers/scrapy-collector",
    "apps/execution-coordination",
    "apps/acquisition-output",
    "apps/acquisition-application",
    "apps/acquisition-lifecycle",
    "apps/work-intake",
    "libs/python/contract-resolution",
    "libs/python/bot-build",
    "libs/python/observability",
]

[tool.uv.sources]
mozaic-scout = { workspace = true }
mozaic-collector-engineering = { workspace = true }
mozaic-scrapy-collector = { workspace = true }
mozaic-execution-coordination = { workspace = true }
mozaic-acquisition-output = { workspace = true }
mozaic-trusted-acquisition-application = { workspace = true }
mozaic-acquisition-lifecycle = { workspace = true }
mozaic-work-intake = { workspace = true }
mozaic-contract-resolution = { workspace = true }
mozaic-bot-build = { workspace = true }
mozaic-observability = { workspace = true }
