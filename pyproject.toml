[project]
name = "data-mozaic-workspace"
version = "0.0.0"
description = "Development tooling for the Data Mozaic monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "jsonschema[format]>=4.23,<5",
    "pre-commit>=4.5,<5",
    "psycopg[binary]>=3.2,<4",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/scout", "libs/python/observability"]

[tool.uv.sources]
mozaic-scout = { workspace = true }
mozaic-observability = { workspace = true }
