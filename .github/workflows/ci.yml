name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tooling/check_commit_message.py --message "$PR_TITLE"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.8"
      - name: Run repository checks
        run: make ci

  mongodb-integration:
    name: BC05 MongoDB Integration Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.8"
      - name: Provision replica set and run BC05 persistence integration tests
        run: make acquisition-output-mongo-tests
      - name: Stop MongoDB while preserving the runner volume
        if: always()
        run: |
          if [ -f .env.mongodb ]; then
            make acquisition-output-mongo-down
          fi

  artifact-custody-go:
    name: BC06 Go Unit, Race, and Vulnerability Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Go format, analysis, unit, race, Linux build, and vulnerability checks
        run: |
          make artifact-custody-go-format-check
          make artifact-custody-go-vet
          make artifact-custody-go-test
          make artifact-custody-go-race
          make artifact-custody-go-build
          make artifact-custody-go-vuln

  artifact-custody-integration:
    name: BC06 PostgreSQL/RustFS and BC05/MongoDB Interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.8"
      - name: Configure disposable PostgreSQL credentials
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=scout
          POSTGRES_PASSWORD=scout_ci_only
          POSTGRES_DB=scout_dev
          SCOUT_POSTGRES_PORT=55432
          SCOUT_DATABASE_URL=postgresql://scout:scout_ci_only@127.0.0.1:55432/scout_dev
          EOF
      - name: Start existing PostgreSQL profile and bootstrap isolated BC06 roles
        run: |
          make db-up
          make artifact-custody-setup
          make artifact-custody-db-bootstrap
      - name: Provision MongoDB replica set and run BC05 real-store tests
        run: |
          make acquisition-output-mongo-setup
          make acquisition-output-mongo-tests
      - name: Run real BC05/MongoDB to BC06/PostgreSQL/RustFS flow
        run: make artifact-custody-integration
      - name: Exercise real PostgreSQL/RustFS recovery and independent writers
        run: make artifact-custody-recovery-tests
      - name: Exercise durable BC04 runs and BC04-to-BC05 finalization
        run: make execution-coordination-finalization-tests
      - name: Verify BC06 PostgreSQL logical restore into an isolated schema
        run: make artifact-custody-backup-restore
      - name: Run one bounded BC06 reconciliation pass
        run: make artifact-custody-reconcile
      - name: Stop local services while preserving volumes
        if: always()
        run: |
          if [ -f .env.artifact-custody ]; then make artifact-custody-down; fi
          if [ -f .env.mongodb ]; then make acquisition-output-mongo-down; fi
          if [ -f .env ]; then make db-down; fi

  integration-security:
    name: Integration Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SCOUT_HTTP_E2E_PROJECT: scout-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The bundle must identify the published PR branch commit, not the
          # synthetic pull_request merge commit used by the event's default SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.8"
      - name: Install locked project dependencies
        run: make sync
      - name: Configure synthetic local PostgreSQL credentials
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=scout
          POSTGRES_PASSWORD=scout_ci_only
          POSTGRES_DB=scout_dev
          SCOUT_POSTGRES_PORT=55432
          SCOUT_DATABASE_URL=postgresql://scout:scout_ci_only@127.0.0.1:55432/scout_dev
          EOF
      - name: Start Compose PostgreSQL and verify migrations
        run: |
          make db-up
          make db-status
          make db-migrate
      - name: PostgreSQL integration and recovery tests
        run: make test-integration
      - name: Protected BC15 replay executor and MCP boundary
        run: make scout-protected-replay-check
      - name: Official MCP client and controlled HTTPS fixture
        run: make scout-http-e2e
      - name: Squid DNS adversarial and connection-time tests
        run: make scout-dns-adversarial-check
      - name: Worker network sandbox check
        run: make scout-sandbox-check
      - name: Collector Playbook v2 examples in offline network sandbox
        run: make collector-playbook-examples
      - name: Collector Python Reference and Scrapy cross-backend conformance
        run: make collector-cross-backend-conformance
      - name: Scrapy Collector multi-bot Linux image conformance
        run: make scrapy-collector-multibot-conformance
      - name: BC04 protected Scrapy execution Linux E2E
        run: make execution-coordination-protected-e2e
      - name: Build, import, and smoke-test Linux release bundle
        env:
          SCOUT_RELEASE_ROOT: ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}
          SCOUT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOUT_DATABASE_URL: postgresql://scout:scout_ci_only@127.0.0.1:55432/scout_dev
          SCOUT_BASE_IMAGE: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
          SCOUT_DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$SCOUT_SOURCE_SHA"
          mkdir -p "$SCOUT_RELEASE_ROOT"
          uv run --locked python tooling/build_bc15_worker_image.py \
            --base-image "$SCOUT_BASE_IMAGE" \
            --platform linux/amd64 \
            --docker-host "$SCOUT_DOCKER_HOST" \
            --verify-docker-host "$SCOUT_DOCKER_HOST" \
            --candidate-record "$SCOUT_RELEASE_ROOT/worker-image-id.txt" \
            --output "$SCOUT_RELEASE_ROOT/worker"
          uv run --locked python tooling/package_scout_broker.py \
            --target-platform linux/amd64 \
            --worker-bundle "$SCOUT_RELEASE_ROOT/worker" \
            --output "$SCOUT_RELEASE_ROOT/bundle"
          COMMIT_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          MANIFEST_SHA="$(sha256sum "$SCOUT_RELEASE_ROOT/bundle/manifest.json" | cut -d ' ' -f 1)"
          uv run --locked python tooling/verify_scout_bundle.py \
            "$SCOUT_RELEASE_ROOT/bundle" \
            --expected-commit "$COMMIT_SHA" \
            --expected-tree "$TREE_SHA" \
            --target-platform linux/amd64 \
            --expected-manifest-sha256 "$MANIFEST_SHA" \
            --source-root "$GITHUB_WORKSPACE" \
            --docker-host "$SCOUT_DOCKER_HOST"
          STAGING_PREFIX="$SCOUT_RELEASE_ROOT/staging"
          sh "$SCOUT_RELEASE_ROOT/bundle/install_scout_bundle.sh" \
            "$SCOUT_RELEASE_ROOT/bundle" "$STAGING_PREFIX" \
            "$COMMIT_SHA" "$TREE_SHA" linux/amd64 "$MANIFEST_SHA" \
            "$SCOUT_DOCKER_HOST"
          WORKER_IMAGE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["worker_image_id"])' "$SCOUT_RELEASE_ROOT/worker/worker-manifest.json")"
          SCOUT_STAGING_PREFIX="$STAGING_PREFIX" \
            SCOUT_BC15_WORKER_IMAGE_DIGEST="$WORKER_IMAGE_ID" \
            uv run --locked python tooling/check_scout_bundle_staging.py
          printf 'commit=%s\ntree=%s\nmanifest_sha256=%s\nworker_image_id=%s\n' \
            "$COMMIT_SHA" "$TREE_SHA" "$MANIFEST_SHA" "$WORKER_IMAGE_ID" \
            > "$SCOUT_RELEASE_ROOT/release-evidence.txt"
      - name: Remove only the release candidate worker image
        if: always()
        env:
          SCOUT_RELEASE_ROOT: ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}
          SCOUT_DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          image_record="$SCOUT_RELEASE_ROOT/worker-image-id.txt"
          if [ -f "$image_record" ]; then
            worker_image_id="$(cat "$image_record")"
            if ! printf '%s\n' "$worker_image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "invalid scoped worker image cleanup record" >&2
              exit 1
            fi
            if docker --host "$SCOUT_DOCKER_HOST" image inspect "$worker_image_id" >/dev/null 2>&1; then
              docker --host "$SCOUT_DOCKER_HOST" image rm --force "$worker_image_id"
            fi
            if docker --host "$SCOUT_DOCKER_HOST" image inspect "$worker_image_id" >/dev/null 2>&1; then
              echo "release candidate worker image remains after scoped cleanup" >&2
              exit 1
            fi
          fi
      - name: Upload Linux release candidate bundle
        id: upload-linux-release-candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scout-broker-linux-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}/bundle/
            ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}/release-evidence.txt
          if-no-files-found: error
          retention-days: 14
      - name: Download the distributed bundle for independent re-verification
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ steps.upload-linux-release-candidate.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}/downloaded
      - name: Verify the exact downloaded artifact
        env:
          SCOUT_RELEASE_ROOT: ${{ runner.temp }}/scout-release-${{ github.run_id }}-${{ github.run_attempt }}
          SCOUT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          downloaded="$SCOUT_RELEASE_ROOT/downloaded"
          source_bundle="$SCOUT_RELEASE_ROOT/bundle"
          test -f "$downloaded/release-evidence.txt"
          test -d "$downloaded/bundle"
          COMMIT_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          test "$COMMIT_SHA" = "$SCOUT_SOURCE_SHA"
          grep -Fx "commit=$COMMIT_SHA" "$downloaded/release-evidence.txt"
          grep -Fx "tree=$TREE_SHA" "$downloaded/release-evidence.txt"
          MANIFEST_SHA="$(sha256sum "$source_bundle/manifest.json" | cut -d ' ' -f 1)"
          grep -Fx "manifest_sha256=$MANIFEST_SHA" "$downloaded/release-evidence.txt"
          test "$(sha256sum "$downloaded/bundle/manifest.json" | cut -d ' ' -f 1)" = "$MANIFEST_SHA"
          uv run --locked python tooling/verify_scout_bundle.py \
            "$downloaded/bundle" \
            --expected-commit "$COMMIT_SHA" \
            --expected-tree "$TREE_SHA" \
            --target-platform linux/amd64 \
            --expected-manifest-sha256 "$MANIFEST_SHA" \
            --source-root "$GITHUB_WORKSPACE"
      - name: Stop E2E Compose profile (preserve volumes)
        if: always()
        env:
          SCOUT_HTTP_E2E_CERT_DIR: /tmp/nonexistent-certs
          SCOUT_HTTP_E2E_SQUID_CONFIG: /tmp/nonexistent-squid.conf
          SCOUT_HTTP_E2E_PROXY_PORT: "3137"
          SCOUT_HTTP_E2E_DNS_CONTROL_PORT: "8053"
          # Compose interpolates all required addresses even for `down`.
          # This unique, unused private subnet is only for parsing cleanup config.
          SCOUT_HTTP_E2E_SUBNET: 172.29.255.0/24
          SCOUT_HTTP_E2E_SQUID_IP: 172.29.255.2
          SCOUT_HTTP_E2E_FIXTURE_IP: 172.29.255.10
          SCOUT_HTTP_E2E_SINK_IP: 172.29.255.11
          SCOUT_HTTP_E2E_DNS_IP: 172.29.255.53
        run: |
          docker compose \
            --project-name "$SCOUT_HTTP_E2E_PROJECT" \
            --file deployments/compose/scout-http-e2e.compose.yaml \
            down --remove-orphans
      - name: Stop PostgreSQL Compose (preserve volume)
        if: always()
        run: |
          if [ -f .env ]; then
            make db-down
          fi
