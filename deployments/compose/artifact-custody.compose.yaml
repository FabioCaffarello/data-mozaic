name: data-mozaic-bc06-local

services:
  rustfs:
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?run artifact-custody-setup}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?run artifact-custody-setup}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - bc06-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    mem_limit: 1g
    cpus: 2.0
    networks: [bc06-storage]
    stop_grace_period: 30s

  rustfs-provision:
    build:
      context: ../../apps/artifact-custody
      dockerfile: Dockerfile
      target: object-provisioner
    env_file: [../../.env.artifact-custody]
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    networks: [bc06-storage]

  artifact-custody-migrate:
    build:
      context: ../../apps/artifact-custody
      dockerfile: Dockerfile
      target: migrator
    env_file: [../../.env.artifact-custody]
    restart: "no"
    networks: [bc06-postgres]

  artifact-custody-reconcile:
    build:
      context: ../../apps/artifact-custody
      dockerfile: Dockerfile
      target: reconciler
    env_file: [../../.env.artifact-custody]
    profiles: [operations]
    tmpfs:
      - /tmp/bc06-upload:rw,noexec,nosuid,size=420m,mode=0700,uid=65532,gid=65532
    networks: [bc06-postgres, bc06-storage]

  artifact-custody-integration-tests:
    build:
      context: ../../apps/artifact-custody
      dockerfile: Dockerfile
      target: integration-tests
    env_file: [../../.env.artifact-custody]
    environment:
      BC06_REAL_STORE_TESTS: "1"
    command: ["./internal/adapters/postgres", "-run", "TestRecoveryAfterObjectCommitBeforeInventoryConfirmation", "-count=1", "-v"]
    profiles: [tests]
    depends_on:
      rustfs:
        condition: service_healthy
      artifact-custody-migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp/bc06-upload:rw,noexec,nosuid,size=420m,mode=0700,uid=65532,gid=65532
    networks: [bc06-postgres, bc06-storage]

  artifact-custody:
    build:
      context: ../../apps/artifact-custody
      dockerfile: Dockerfile
      target: runtime
    env_file: [../../.env.artifact-custody]
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      rustfs:
        condition: service_healthy
      artifact-custody-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/artifact-custody", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    tmpfs:
      - /tmp/bc06-upload:rw,noexec,nosuid,size=420m,mode=0700,uid=65532,gid=65532
    mem_limit: 768m
    cpus: 2.0
    networks: [bc06-postgres, bc06-storage]
    stop_grace_period: 20s

volumes:
  bc06-rustfs-data:
    name: data-mozaic-bc06-rustfs-data

networks:
  bc06-storage:
    name: data-mozaic-bc06-storage
    internal: true
  bc06-postgres:
    external: true
    name: data-mozaic-scout-local_default
