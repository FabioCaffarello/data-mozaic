http_port 3128
cache deny all
forwarded_for delete
via off
dns_nameservers 172.30.91.53

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 443
acl source_hosts dstdomain "/etc/squid/allowed-domains.txt"
acl blocked_destinations dst @BLOCKED_DESTINATIONS@

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked_destinations
http_access allow CONNECT source_hosts
http_access deny all

logformat e2e %ts.%03tu %master_xaction %>rd %<a %Sh %Ss/%03>Hs %rm
access_log /tmp/scout_access.log e2e
