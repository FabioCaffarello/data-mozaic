repos:
  - repo: local
    hooks:
      - id: make-check
        name: Repository checks (make check)
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: Conventional Commit header
        entry: python tooling/check_commit_message.py --file
        language: system
        stages: [commit-msg]
        pass_filenames: true
